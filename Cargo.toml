[package]
name = "memory-mcp"
version = "0.1.0"
edition = "2024"
description = "Owner-controlled, append-only memory server for AI agents over MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cryply/memory-mcp"
readme = "README.md"
keywords = ["mcp", "memory", "agents", "append-only"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2.191"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
